[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantstruct"
version = "0.1.0"
description = "Industrial plant structures: API 650 tanks (Housner masses, shell buckling, anchorage), silos (EN 1991-4), chimneys, pipe racks, bunkers and composite mezzanine beams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["industrial-structures", "API-650", "storage-tanks", "silos", "EN-1991-4", "pipe-rack", "chimney", "structural-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "httpx>=0.27"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/plantstruct"
Repository = "https://github.com/jmurgass99/plantstruct"
Issues = "https://github.com/jmurgass99/plantstruct/issues"

[tool.setuptools.packages.find]
include = ["plantstruct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
