[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantstruct"
version = "0.2.0"
description = "Industrial plant structures: API 650 tanks (one-foot shell courses, hoop tension, shell buckling, external pressure, Annex E Housner masses with impulsive/convective periods, SRSS shear and moment, anchorage ratio J, bolts, full memo, stick model for SAP2000, ASCE 7-22 15.7), EN 1991-4 silos (Janssen, slenderness, discharge, patch load, EN 1993-1-6 buckling), chimneys, LPG spheres, pipe racks, portal frames, blast walls, column bases with ACI 318-19 ch. 17 anchors and composite mezzanine beams (AISC 360, EN 1994)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["industrial-structures", "API-650", "storage-tanks", "housner", "seismic-tanks", "ASCE-7", "silos", "EN-1991-4", "janssen", "shell-buckling", "EN-1993-1-6", "pipe-rack", "chimney", "LPG-sphere", "ASME-VIII", "column-base-plate", "anchor-bolts", "ACI-318", "composite-beams", "AISC-360", "EN-1994", "structural-engineering", "plant-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "httpx>=0.27"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/plantstruct"
Repository = "https://github.com/jmurgass99/plantstruct"
Issues = "https://github.com/jmurgass99/plantstruct/issues"

[tool.setuptools.packages.find]
include = ["plantstruct*"]

[tool.setuptools.package-data]
plantstruct = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
